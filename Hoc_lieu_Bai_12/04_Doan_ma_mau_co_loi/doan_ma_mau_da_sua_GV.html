<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <title>Đăng kí môn thi tốt nghiệp (Bản đã sửa 5 lỗi - Đáp án GV)</title>
</head>
<body>
  <h1>Đăng kí môn thi tốt nghiệp</h1>
  <!-- Sửa lỗi 5: Đổi method="GET" thành method="POST" để không làm lộ số CCCD trên thanh địa chỉ -->
  <form action="xuly.php" method="POST">
    <fieldset>
      <label for="hoten">Họ và tên:</label>
      <input type="text" id="hoten" name="hoTen"><br><br>

      <!-- Sửa lỗi 1: Cho thuộc tính for của label khớp với id của input (cùng là "cccd") -->
      <!-- Gợi ý mở rộng (KHBD tr.17): có thể dùng type="text" maxlength="12" để giữ số 0 ở đầu -->
      <label for="cccd">CCCD:</label>
      <input type="number" id="cccd" name="cccd"><br><br>

      <!-- Sửa lỗi 2: Đổi type="text" thành type="date" cho Ngày sinh -->
      <label for="ngaysinh">Ngày sinh:</label>
      <input type="date" id="ngaysinh" name="ngaySinh"><br><br>

      <!-- Sửa lỗi 3: Đặt chung name="gioiTinh" cho cả 2 ô radio Nam và Nữ -->
      Giới tính:
      <input type="radio" id="nam" name="gioiTinh" value="Nam">
      <label for="nam">Nam</label>
      <input type="radio" id="nu" name="gioiTinh" value="Nu">
      <label for="nu">Nữ</label><br><br>

      <!-- Sửa lỗi 4: Bổ sung name="monThi" cho ô checkbox Toán -->
      Môn thi:
      <input type="checkbox" id="toan" name="monThi" value="Toan">
      <label for="toan">Toán</label>
      <input type="checkbox" id="van" name="monThi" value="NguVan">
      <label for="van">Ngữ văn</label>
      <input type="checkbox" id="nn" name="monThi" value="NgoaiNgu">
      <label for="nn">Ngoại ngữ</label><br><br>

      <label for="tohop">Tổ hợp:</label>
      <select id="tohop" name="toHop">
        <option value="KHTN">Khoa học tự nhiên</option>
        <option value="KHXH">Khoa học xã hội</option>
      </select><br><br>

      <input type="submit" value="Gửi thông tin">
    </fieldset>
  </form>
</body>
</html>
